l_english:
 #Superproject planet classes (Wilderness)
 pc_pd_core_tap_wilderness: "Coreheart"
 pc_pd_core_tap_wilderness_desc: "This world's crust has split along living veins that reach down into its molten core. Tendrils of glowing tissue draw primal energy upward, feeding the Wilderness on the surface while the old ecosystem is slowly digested."
 pc_pd_core_tap_wilderness_adj: "core"
 mod_pc_pd_core_tap_wilderness_habitability: "Coreheart Habitability"
 trait_pc_pd_core_tap_wilderness_preference: "Coreheart Preference"
 trait_pc_pd_core_tap_wilderness_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_agriworld_wilderness: "Harvestheart"
 pc_pd_agriworld_wilderness_desc: "Endless orchards of flesh and leaf have swallowed this world. Root-nets and fruiting bodies drink from deep reservoirs, turning the entire crust into one vast, breathing harvest that never stops growing."
 pc_pd_agriworld_wilderness_adj: "harvest"
 mod_pc_pd_agriworld_wilderness_habitability: "Harvestheart Habitability"
 trait_pc_pd_agriworld_wilderness_preference: "Harvestheart Preference"
 trait_pc_pd_agriworld_wilderness_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_stripmine_wilderness: "Oremarrow"
 pc_pd_stripmine_wilderness_desc: "The surface of this world has been flayed to the bone, exposing a rich mineral marrow. Living tunnels and stone-eating growths bore through the exposed strata, digesting ore and leaving hollow, valuable channels behind."
 pc_pd_stripmine_wilderness_adj: "ore"
 mod_pc_pd_stripmine_wilderness_habitability: "Oremarrow Habitability"
 trait_pc_pd_stripmine_wilderness_preference: "Oremarrow Preference"
 trait_pc_pd_stripmine_wilderness_preference_desc: "$trait_pc_arctic_preference_desc$"
 #Superproject planet modifiers (Wilderness)
 pd_aw_core_tap_wilderness: "Coreheart"
 pd_aw_core_tap_wilderness_desc: "Living channels tap the planet's core, flooding the surface with primal energy."
 pd_aw_core_tap_wilderness_tooltip: "£district£ £G$district_photosynthesis_fields_plural$£! are uncapped"
 pd_aw_agriworld_wilderness: "Harvestheart"
 pd_aw_agriworld_wilderness_desc: "A single breathing orchard covers the world, fed by deep root-nets."
 pd_aw_agriworld_wilderness_tooltip: "£district£ £G$district_orchard_forests_plural$£! are uncapped"
