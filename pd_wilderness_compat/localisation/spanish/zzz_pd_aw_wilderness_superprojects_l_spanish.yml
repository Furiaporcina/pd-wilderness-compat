l_spanish:
 #Superproject planet classes (Wilderness)
 pc_pd_core_tap_wilderness: "Corazón del Núcleo"
 pc_pd_core_tap_wilderness_desc: "La corteza de este mundo se ha abierto a lo largo de venas vivas que descienden hasta su núcleo fundido. Zarcillos de tejido brillante extraen energía primordial hacia la superficie, alimentando a la Mente Salvaje mientras el antiguo ecosistema es digerido lentamente."
 pc_pd_core_tap_wilderness_adj: "nuclear"
 mod_pc_pd_core_tap_wilderness_habitability: "Habitabilidad de Corazón del Núcleo"
 trait_pc_pd_core_tap_wilderness_preference: "Preferencia de Corazón del Núcleo"
 trait_pc_pd_core_tap_wilderness_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_agriworld_wilderness: "Corazón de la Cosecha"
 pc_pd_agriworld_wilderness_desc: "Infinitos huertos de carne y hoja han devorado este mundo. Redes de raíces y cuerpos fructíferos beben de reservas profundas, convirtiendo toda la corteza en una cosecha inmensa y palpitante que nunca deja de crecer."
 pc_pd_agriworld_wilderness_adj: "cosechero"
 mod_pc_pd_agriworld_wilderness_habitability: "Habitabilidad de Corazón de la Cosecha"
 trait_pc_pd_agriworld_wilderness_preference: "Preferencia de Corazón de la Cosecha"
 trait_pc_pd_agriworld_wilderness_preference_desc: "$trait_pc_arctic_preference_desc$"
 pc_pd_stripmine_wilderness: "Médula de Mineral"
 pc_pd_stripmine_wilderness_desc: "La superficie de este mundo ha sido desollada hasta el hueso, dejando al descubierto una rica médula mineral. Túneles vivos y brotes devoradores de piedra perforan los estratos expuestos, digiriendo el mineral y dejando tras de sí canales huecos y valiosos."
 pc_pd_stripmine_wilderness_adj: "medular"
 mod_pc_pd_stripmine_wilderness_habitability: "Habitabilidad de Médula de Mineral"
 trait_pc_pd_stripmine_wilderness_preference: "Preferencia de Médula de Mineral"
 trait_pc_pd_stripmine_wilderness_preference_desc: "$trait_pc_arctic_preference_desc$"
 #Superproject planet modifiers (Wilderness)
 pd_aw_core_tap_wilderness: "Corazón del Núcleo"
 pd_aw_core_tap_wilderness_desc: "Canales vivos perforan el núcleo del planeta e inundan la superficie con energía primordial."
 pd_aw_core_tap_wilderness_tooltip: "£district£ £G$district_photosynthesis_fields_plural$£! sin límite máximo"
 pd_aw_agriworld_wilderness: "Corazón de la Cosecha"
 pd_aw_agriworld_wilderness_desc: "Un único huerto palpitante cubre el mundo, alimentado por redes de raíces profundas."
 pd_aw_agriworld_wilderness_tooltip: "£district£ £G$district_orchard_forests_plural$£! sin límite máximo"
 pd_aw_stripmine_wilderness: "Médula de Mineral"
 pd_aw_stripmine_wilderness_desc: "Túneles vivos y brotes devoradores de piedra digieren la médula mineral expuesta."
 pd_aw_stripmine_wilderness_tooltip: "£district£ £G$district_hollow_mountains_plural$£! sin límite máximo"
